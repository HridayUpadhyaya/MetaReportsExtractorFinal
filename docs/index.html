<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta India Reports</title>
<style>body{font-family:system-ui,Segoe UI,Arial;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.5}a.button{display:inline-block;padding:12px 18px;background:#1b5e8f;color:white;text-decoration:none;border-radius:6px}code{background:#f4f4f4;padding:2px 5px}</style></head><body>
<h1>Meta India Regulatory Transparency Reports</h1>
<p>This static site hosts the latest validated spreadsheet generated from official Meta India report PDFs.</p>
<p><a class="button" href="downloads/meta_india_reports_latest.xlsx">Download latest Excel</a></p>
<p id="status">Loading status…</p>
<script>fetch('status.json').then(r=>r.json()).then(s=>{document.getElementById('status').textContent=`Latest period: ${s.latest_period_end||'none'} • Reports: ${s.reports} • Rows: ${s.rows} • Generated: ${s.generated_at}`}).catch(()=>{document.getElementById('status').textContent='No generated dataset yet.'});</script>
</body></html>
